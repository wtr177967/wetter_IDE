<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wetter IDE – Download</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        .logo {
            font-size: 56px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        .tagline {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 32px;
        }

        .version-badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 999px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            margin-bottom: 32px;
            letter-spacing: 0.5px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #fff;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
            margin-bottom: 16px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(56, 189, 248, 0.45);
        }

        .btn-secondary {
            background: rgba(148, 163, 184, 0.1);
            color: #cbd5e1;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(148, 163, 184, 0.18);
            transform: translateY(-2px);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 28px 0;
            color: #64748b;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(148, 163, 184, 0.2);
        }

        .meta {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 28px;
        }

        .meta-item {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 10px;
            padding: 14px 8px;
            text-align: center;
        }

        .meta-item .label {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .meta-item .value {
            font-size: 13px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #475569;
            line-height: 1.6;
        }

        .footer a {
            color: #38bdf8;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #334155;
            color: #f8fafc;
            padding: 12px 24px;
            border-radius: 999px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            .card { padding: 36px 24px; }
            h1 { font-size: 24px; }
            .logo { font-size: 48px; }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">🐾</div>
    <h1>Wetter IDE</h1>
    <p class="tagline">A friendly programming language made for everyone.</p>
    <span class="version-badge">Version 1.0 · Windows 64-bit</span>

    <!-- ======== 下载按钮（核心） ======== -->
    <a class="btn btn-primary" id="downloadBtn" href="Wetter_IDE_Setup.exe" download>
        ⬇ Download for Windows
    </a>

    <div class="divider">or</div>

    <button class="btn btn-secondary" onclick="copyLink()">
        🔗 Copy Download Link
    </button>

    <div class="meta">
        <div class="meta-item">
            <div class="label">Publisher</div>
            <div class="value">Wang Taorun</div>
        </div>
        <div class="meta-item">
            <div class="label">License</div>
            <div class="value">MIT</div>
        </div>
        <div class="meta-item">
            <div class="label">Size</div>
            <div class="value">~25 MB</div>
        </div>
    </div>

    <div class="footer">
        By downloading, you agree to our Terms of Use.<br>
        Need help? <a href="#" onclick="showToast('Docs coming soon!')">Read the docs →</a>
    </div>
</div>

<div id="toast"></div>

<script>
    const btn = document.getElementById('downloadBtn');

    // 如果 exe 不在这个 html 旁边，把 URL 改成你的真实下载地址，例如：
    // btn.href = "https://your-domain.com/downloads/Wetter_IDE_Setup.exe";

    function copyLink() {
        const url = new URL(btn.href, window.location.href).href;
        navigator.clipboard.writeText(url).then(() => {
            showToast("Download link copied to clipboard!");
        }).catch(() => {
            showToast("Could not copy link.");
        });
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
    }
</script>

</body>
</html>
